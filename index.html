<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #030612;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. MOĆNA POZADINA SA ZLATNIM RADIJALNIM SVETLOM I TEGET TONOVIMA */
        .bg-glow-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.15) 0%, transparent 45%),
                radial-gradient(circle at center, #0f224a 0%, #030612 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* 2. SVETLEĆE ČESTICE / ZVEZDICE U POZADINI DA POPUNE PRAZNINU */
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #d4af37, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, #d4af37, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 120px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 200px, #d4af37, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 300px 80px, #f3e5ab, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 180px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 600px 300px, #d4af37, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 750px 100px, #f3e5ab, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 850px 400px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 950px 200px, #d4af37, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 500px 500px;
            opacity: 0.6;
            z-index: 1;
            pointer-events: none;
            animation: twinkle 5s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.8; }
        }

        /* GLAVNA KARTICA */
        .main-container {
            position: relative;
            z-index: 2;
            background: rgba(8, 14, 30, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid #d4af37;
            border-radius: 32px;
            padding: 30px 35px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(212, 175, 55, 0.4), inset 0 0 25px rgba(212, 175, 55, 0.15);
            text-align: center;
            max-width: 460px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .station-title {
            color: #d4af37;
            margin: 0;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
        }

        .genres {
            color: #b3c0ed;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -8px;
            opacity: 0.9;
        }

        /* LEOPARD SA BRUTALNIM ZLATNIM SJAJEM NA HOVER */
        .logo-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.45);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-wrapper:hover {
            transform: scale(1.04);
            border-color: #f3e5ab;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.9), 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 30px rgba(212, 175, 55, 0.7);
        }

        .logo-img {
            width: 100%;
            max-height: 290px;
            object-fit: cover;
            display: block;
            transition: filter 0.4s ease;
        }

        .logo-wrapper:hover .logo-img {
            filter: contrast(120%) brightness(108%);
        }

        /* PLEJER */
        .player-box {
            background: rgba(3, 6, 18, 0.8);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .player-box:hover {
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .cstrEmbed {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .cstrEmbed a {
            color: #d4af37;
            font-size: 10px;
            opacity: 0.4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Pozadinski svetlosni efekti -->
    <div class="bg-glow-container"></div>
    <div class="stars-bg"></div>

    <!-- Glavni sadržaj -->
    <div class="main-container">
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Leopard sa jakim sjajem -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
        </div>

        <!-- Plejer -->
        <div class="player-box">
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

</body>
</html>
