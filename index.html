<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio</title>
    <style>
        :root {
            --bg-navy: #0a0f1d;
            --card-navy: #111a33;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-navy);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            background-color: var(--card-navy);
            border: 2px solid var(--gold);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 0 25px rgba(10, 15, 29, 0.8), inset 0 0 15px rgba(212, 175, 55, 0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: all 0.3s ease;
        }

        h1 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        p {
            color: #b0c4de;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        /* Stilizovanje plejera i interaktivnih elemenata sa zlatnim sjajem na klik */
        .cstrEmbed, button, a {
            transition: all 0.2s ease-in-out;
        }

        .cstrEmbed:active, button:active, a:active {
            transform: scale(0.97);
            box-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold) !important;
        }

        /* Plejer kontejner */
        .player-box {
            margin: 20px 0;
            padding: 15px;
            background: rgba(10, 15, 29, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .player-box:hover {
            box-shadow: 0 0 15px var(--gold-glow);
            border-color: var(--gold);
        }

        /* Linkovi ka Caster.fm u diskretnoj zlatnoj boji */
        .footer-links {
            margin-top: 20px;
            font-size: 0.8rem;
        }

        .footer-links a {
            color: var(--gold);
            text-decoration: none;
            opacity: 0.7;
            margin: 0 5px;
        }

        .footer-links a:hover {
            opacity: 1;
            text-shadow: 0 0 8px var(--gold);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>APEX RADIO</h1>
        <p>Urban, Deep House & Afro House Beats</p>

        <div class="player-box">
            <!-- Tvoj Caster.fm plejer kod -->
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
        </div>

        <div class="footer-links">
            <a href="https://www.caster.fm" target="_blank">Shoutcast Hosting</a>
        </div>
    </div>

    <!-- Skripta za Caster.fm plejer -->
    <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
</body>
</html>
