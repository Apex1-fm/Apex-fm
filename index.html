<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #030612;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. LEOPARD JE SADA POZADINA PREKO CELOG EKRANA */
        .bg-leopard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center;
            /* Zatamnjujemo i dajemo teget-zlatni ton da ne bode oči, već da izgleda svetski */
            filter: brightness(0.35) contrast(120%) saturate(80%);
            z-index: 0;
            transform: scale(1.05); /* Sprečava bele ivice */
            animation: subtleZoom 20s ease-in-out infinite alternate;
        }

        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* 2. DODATNI SVETLOSNI PRELIV DA RAZBIJE MONOTONIJU */
        .overlay-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(15, 34, 74, 0.4) 0%, rgba(3, 6, 18, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* 3. GLAVNA KARTICA U SREDINI SA PLEJEROM */
        .main-container {
            position: relative;
            z-index: 2;
            background: rgba(8, 14, 30, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid #d4af37;
            border-radius: 30px;
            padding: 35px 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(212, 175, 55, 0.35), inset 0 0 20px rgba(212, 175, 55, 0.15);
            text-align: center;
            max-width: 440px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: all 0.3s ease;
        }

        .main-container:hover {
            box-shadow: 0 0 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(212, 175, 55, 0.5), inset 0 0 25px rgba(212, 175, 55, 0.25);
            border-color: #f3e5ab;
        }

        .station-title {
            color: #d4af37;
            margin: 0;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
        }

        .genres {
            color: #b3c0ed;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -8px;
            opacity: 0.9;
        }

        /* PLEJER SEKCIJA */
        .player-box {
            background: rgba(3, 6, 18, 0.75);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .player-box:hover {
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .cstrEmbed {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .cstrEmbed a {
            color: #d4af37;
            font-size: 10px;
            opacity: 0.4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Pozadina je sad tvoj leopard preko celog ekrana -->
    <div class="bg-leopard"></div>
    <div class="overlay-glow"></div>

    <!-- Centralni deo sa plejerom -->
    <div class="main-container">
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <div class="player-box">
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

</body>
</html>
