<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: #030612;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Pozadinski svetlosni ambijent i zvezdice da popune prostor okolo */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at center, #0d1b3a 0%, #030612 100%);
            z-index: 0;
            pointer-events: none;
        }

        .bg-particles {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                radial-gradient(2px 2px at 50px 80px, #d4af37, transparent),
                radial-gradient(2px 2px at 200px 150px, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 350px 300px, #d4af37, transparent),
                radial-gradient(2px 2px at 500px 100px, #f3e5ab, transparent),
                radial-gradient(2px 2px at 700px 250px, #ffffff, transparent),
                radial-gradient(2.5px 2.5px at 850px 450px, #d4af37, transparent),
                radial-gradient(2px 2px at 150px 550px, #ffffff, transparent),
                radial-gradient(2px 2.5px at 400px 600px, #f3e5ab, transparent);
            background-repeat: repeat;
            background-size: 600px 600px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        /* Glavna luksuzna kartica sa dvostrukim graviranim zlatnim okvirom */
        .main-container {
            position: relative;
            z-index: 1;
            background: linear-gradient(145deg, #0f1833, #070b19);
            border: 3px solid #d4af37;
            border-radius: 36px;
            padding: 40px 35px;
            box-shadow: 
                0 0 0 6px rgba(11, 19, 41, 0.8),
                0 0 0 9px rgba(212, 175, 55, 0.3),
                0 25px 60px rgba(0, 0, 0, 0.95), 
                0 0 50px rgba(212, 175, 55, 0.4), 
                inset 0 0 30px rgba(212, 175, 55, 0.2);
            text-align: center;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transition: all 0.4s ease;
        }

        .main-container::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 28px;
            pointer-events: none;
        }

        .main-container:hover {
            box-shadow: 
                0 0 0 6px rgba(11, 19, 41, 0.8),
                0 0 0 10px rgba(212, 175, 55, 0.5),
                0 30px 70px rgba(0, 0, 0, 0.95), 
                0 0 70px rgba(212, 175, 55, 0.6), 
                inset 0 0 40px rgba(212, 175, 55, 0.3);
            border-color: #f3e5ab;
        }

        .station-title {
            color: #d4af37;
            margin: 0;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
        }

        .genres {
            color: #b3c0ed;
            font-size: 0.85rem;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -8px;
            opacity: 0.9;
        }

        /* Okvir za tvoj logo koji sija na dodir mišem */
        .logo-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.2);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-wrapper:hover {
            transform: scale(1.03);
            border-color: #f3e5ab;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.9), inset 0 0 30px rgba(212, 175, 55, 0.5);
        }

        .logo-img {
            width: 100%;
            max-height: 290px;
            object-fit: cover;
            display: block;
            transition: filter 0.4s ease;
        }

        .logo-wrapper:hover .logo-img {
            filter: contrast(115%) brightness(105%);
        }

        /* Plejer sekcija na dnu */
        .player-box {
            background: rgba(3, 6, 18, 0.85);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .player-box:hover {
            border-color: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6);
        }

        .cstrEmbed {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .cstrEmbed a {
            color: #d4af37;
            font-size: 10px;
            opacity: 0.4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="bg-particles"></div>

    <div class="main-container">
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Tvoj logo sa slike ugrađen direktno da se odmah vidi -->
        <div class="logo-wrapper">
            <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?q=80&w=1000&auto=format&fit=crop" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'400\' height=\'250\'><rect width=\'100%\' height=\'100%\' fill=\'%230b132b\'/><text x=\'50%\' y=\'50%\' fill=\'%23d4af37\' font-family=\'Poppins\' font-size=\'20\' text-anchor=\'middle\' dominant-baseline=\'middle\'>APEX RADIO</text></svg>'" alt="Apex Radio Logo" class="logo-img" id="logoPic">
        </div>

        <div class="player-box">
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">

                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

        const reader = new FileReader();

        document.getElementById('logoPic').src = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QBaRXhpZgAATU0AKgAAAAgABAEaAAUAAAABAAAAPgEbAAUAAAABAAAARgEoAAMAAAABAAIAAAExAAIAAAAhAAAATgAAAAAAAABIAAAAAQAAAEgAAAABcGFnZUxvYWRlZAAAAABDaGF0R1BUMQAAAAgAAJAHAAQAAAAW=="; // (Zamenićemo čistim linkom ispod ako zatreba)
    </script>
</body>
</html>
