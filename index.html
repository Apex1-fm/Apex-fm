<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <style>
        body {
            background-color: #0b1329;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #121c38;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            border: 1px solid #d4af37;
            max-width: 480px;
            width: 90%;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 2.6rem;
            letter-spacing: 2px;
        }
        p {
            color: #a0aec0;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #0b1329;
            padding: 16px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .play-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #f3c643, #d4af37);
        }
        .note {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>APEX RADIO</h1>
        <p>Afro House | Deep House | Nu-Disco</p>
        
        <!-- Veliko zlatno dugme koje direktno otvara i pokreće strim -->
        <a href="https://apexradio.ismyradio.com" target="_blank" class="play-btn">
            ▶ Pusti Radio Uživo
        </a>

        <div class="note">
            Klikom na dugme otvara se plejer stanice u punom kvalitetu.
        </div>
    </div>
</body>
</html>
