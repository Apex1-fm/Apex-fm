<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            /* Bogata teget pozadina cele stranice */
            background: linear-gradient(135deg, #0b1329, #152238);
            color: #d4af37;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            /* Teget kartica sa zlatnim obrubom */
            background: #0f1833;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .logo-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .logo-img {
            width: 100%;
            max-height: 230px;
            object-fit: cover;
            display: block;
            /* Efekat mešanja boja da se crna pozadina logoa utopi u teget tonove */
            mix-blend-mode: luminosity;
            filter: contrast(120%) brightness(95%);
        }
        /* Preko slike dodajemo teget preliv da se potpuno stopi sa sajtom */
        .logo-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 40%, rgba(15, 24, 51, 0.8) 100%);
            pointer-events: none;
        }
        .genres {
            color: #b3c0ed;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .player-box {
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 20px;
        }
        .player-frame {
            width: 100%;
            height: 150px;
            border: none;
            border-radius: 12px;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo sa automatskim stapanjem u teget nijanse -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
        </div>

        <!-- Žanrovi -->
        <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>

        <!-- Plejer -->
        <div class="player-box">
            <iframe src="https://apexradio.ismyradio.com" class="player-frame" scrolling="no"></iframe>
        </div>
    </div>

</body>
</html>
