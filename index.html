<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <style>
        body {
            background-color: #0b1329;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #121c38;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            border: 1px solid #d4af37;
            max-width: 480px;
            width: 90%;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 2.3rem;
            letter-spacing: 2px;
        }
        p {
            color: #a0aec0;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .player-frame {
            width: 100%;
            height: 150px;
            border: none;
            border-radius: 10px;
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>APEX RADIO</h1>
        <p>Afro House | Deep House | Nu-Disco</p>
        
        <!-- Ugrađeni plejer sa Caster-a direktno na tvom sajtu -->
        <iframe src="https://apexradio.ismyradio.com" class="player-frame" scrolling="no"></iframe>
    </div>
</body>
</html>
