<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0b1329, #152238);
            color: #d4af37;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            background: #0f1833;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 420px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .station-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin: 0;
        }
        .genres {
            color: #b3c0ed;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -10px;
        }
        /* Plejer u formi slike sa play/pause efektom preko */
        .player-card {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            background: #000;
        }
        .player-card:hover {
            border-color: #d4af37;
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3);
        }
        .logo-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }
        /* Maska / Dugme preko slike nalik Play Radiju */
        .play-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 19, 41, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: background 0.3s ease;
        }
        .player-card:hover .play-overlay {
            background: rgba(11, 19, 41, 0.25);
        }
        .play-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }
        .play-icon svg {
            width: 30px;
            height: 30px;
            fill: #0b1329;
            margin-left: 4px; /* Centriranje trougla */
        }
        .player-card:hover .play-icon {
            transform: scale(1.1);
        }
        .status-badge {
            background: rgba(11, 19, 41, 0.85);
            color: #d4af37;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Naziv i žanrovi -->
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Glavna interaktivna kartica (slika + plejer u jednom) -->
        <div class="player-card" onclick="toggleRadio()">
            <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img" id="logoImage">
            <div class="play-overlay">
                <div class="play-icon" id="playButtonBg">
                    <!-- Play ikonica -->
                    <svg id="playSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
                <div class="status-badge" id="statusText">Slušaj Uživo</div>
            </div>
        </div>

        <!-- Caster.fm audio strim (povezan direktno u pozadini) -->
        <!-- Pošto tvoj Caster nalog emituje stream, koristićemo strim link koji vuče audio direktno -->
        <audio id="audioStream" preload="none">
            <source src="https://stream.cloud.caster.fm/a273938e-f2b4-48c1-8815-5fa149f0d4bc" type="audio/mpeg">
            Vaš pretraživač ne podržava audio element.
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audioStream');
        const statusText = document.getElementById('statusText');
        const playSvg = document.getElementById('playSvg');
        const playButtonBg = document.getElementById('playButtonBg');
        
        let isPlaying = false;

        function toggleRadio() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    statusText.innerText = 'Uživo u etru ♫';
                    // Menjamo ikonicu u pauzu (dve linije)
                    playSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                }).catch(err => {
                    console.error("Greška pri pokretanju strima:", err);
                    statusText.innerText = 'Greška pri puštanju';
                });
            } else {
                audio.pause();
                isPlaying = false;
                statusText.innerText = 'Slušaj Uživo';
                // Vraćamo ikonicu u play (trougao)
                playSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }
    </script>

</body>
</html>
