<!DOCTYPE html>
<html lang="sr">
<head>

            flex-direction: column;

            height: 100vh;

            font-size: 24px;

            margin-bottom: 20px;

        }
        .player-container {
            background-color: #1c2541; /* Za nijansu svetlija teget za karticu */

        /* Malo prilagođavanje linkova da prate temu */
        .cstrEmbed a {
            color: #6fffe9;
            font-size: 12px;
            text-decoration: none;
            display: none; /* Sakriva nepotrebne Caster linkove ako želiš čistiji izgled */

</head>

    <div class="player-container">
        <h1>Apex Radio</h1>
