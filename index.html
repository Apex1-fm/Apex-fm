<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0b1329, #152238);
            color: #d4af37;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .station-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .genres {
            color: #b3c0ed;
            font-size: 0.95rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -12px;
        }
        
        /* Velika svetleća kartica */
        .player-card {
            background: #0f1833;
            border-radius: 24px;
            overflow: hidden;
            /* Početni elegantni zlatni okvir i senka */
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            /* Glatka animacija za sjaj */
            transition: all 0.4s ease;
        }

        /* Efekat kada predješ mišem (kad ga dodirneš) - kartica sija i izdiže se */
        .player-card:hover {
            border-color: #d4af37;
            transform: translateY(-5px);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.6), inset 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .logo-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .logo-img {
            width: 100%;
            max-height: 340px;
            object-fit: cover;
            display: block;
        }

        /* Donji deo sa Caster plejerom */
        .player-box {
            border-top: 1px solid rgba(212, 175, 55, 0.25);
            padding-top: 15px;
            display: flex;
            justify-content: center;
        }
        .cstrEmbed {
            width: 100%;
        }
        .cstrEmbed a {
            color: #d4af37;
            font-size: 10px;
            opacity: 0.4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Naziv i žanrovi -->
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Velika svetleća kartica sa logom i Caster plejerom -->
        <div class="player-card">
            <div class="logo-wrapper">
                <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
            </div>
            
            <div class="player-box">
                <!-- Tvoj originalni Caster plejer kod -->
                <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                    <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                    <a href="https://www.caster.fm">Stream Hosting</a> 
                    <a href="https://www.caster.fm">Radio Server Hosting</a>
                </div>
                <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
            </div>
        </div>
    </div>

</body>
</html>
