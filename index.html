<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #050814;
            --card-navy: #0b132b;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at center, #111d3a 0%, var(--bg-navy) 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Veliki svetleći krug u pozadini da popuni prostor oko kartice */
        body::before {
            content: '';
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, transparent 65%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseBg 4s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        .main-container {
            position: relative;
            z-index: 1;
            background: var(--card-navy);
            border: 2px solid var(--gold);
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(212, 175, 55, 0.3), inset 0 0 25px rgba(212, 175, 55, 0.15);
            text-align: center;
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transition: all 0.4s ease;
        }

        .main-container:hover {
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 60px rgba(212, 175, 55, 0.6), inset 0 0 30px rgba(212, 175, 55, 0.25);
            border-color: var(--gold-light);
        }

        .station-title {
            color: var(--gold);
            margin: 0;
            font-size: 2.3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        .genres {
            color: #b3c0ed;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -10px;
            opacity: 0.9;
        }

        /* ODELJAK ZA LEOPARDA KOJI SIJA */
        .logo-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--gold);
            /* Zlatni sjaj oko same slike leoparda da sija */
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.3);
            transition: all 0.4s ease;
        }

        .logo-wrapper:hover {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.8), inset 0 0 25px rgba(212, 175, 55, 0.5);
            transform: scale(1.02);
        }

        .logo-img {
            width: 100%;
            max-height: 330px;
            object-fit: cover;
            display: block;
            /* Blagi filter da leopard bude kontrastniji i oštriji u teget tonovima */
            filter: contrast(110%) brightness(100%);
        }

        /* Svetleći ram preko leoparda koji daje "wow" efekat */
        .logo-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.4);
            pointer-events: none;
        }

        /* Plejer sekcija */
        .player-box {
            background: rgba(5, 8, 20, 0.7);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .player-box:hover {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        .cstrEmbed {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .cstrEmbed a {
            color: var(--gold);
            font-size: 10px;
            opacity: 0.4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Leopard koji sija i dominira -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
        </div>

        <!-- Caster plejer ispod -->
        <div class="player-box">
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

</body>
</html>
