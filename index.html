<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0b1329, #152238);
            color: #d4af37;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            background: #0f1833;
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(212, 175, 55, 0.25);
            border: 1px solid rgba(212, 175, 55, 0.35);
            max-width: 500px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .station-title {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .genres {
            color: #b3c0ed;
            font-size: 0.95rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -12px;
        }
        /* Velika, upečatljiva kartica za plejer i logo */
        .player-card {
            background: linear-gradient(145deg, #152238, #0b1329);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .logo-wrapper {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .logo-img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            display: block;
        }
        /* Uređenje Caster plejera da se uklopi u našu estetiku */
        .cstrEmbed {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 5px 0;
        }
        .cstrEmbed a {
            color: #d4af37;
            font-size: 10px;
            opacity: 0.5;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Naziv i žanrovi -->
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Velika kartica sa logom i tvojim Caster plejerom -->
        <div class="player-card">
            <div class="logo-wrapper">
                <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
            </div>
            
            <!-- Tvoj Caster plejer ubačen direktno -->
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

</body>
</html>
