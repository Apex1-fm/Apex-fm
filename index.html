<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0b1329, #152238);
            color: #d4af37;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            background: #0f1833;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .logo-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .logo-img {
            width: 100%;
            max-height: 230px;
            object-fit: cover;
            display: block;
            mix-blend-mode: luminosity;
            filter: contrast(120%) brightness(95%);
        }
        .genres {
            color: #b3c0ed;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .player-box {
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        audio {
            width: 100%;
            outline: none;
            filter: sepia(20%) saturate(70%) hue-rotate(180deg); /* Blago toniranje plejera da prati temu */
        }
        .status {
            font-size: 0.85rem;
            color: #8fa3d4;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
        </div>

        <!-- Žanrovi -->
        <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>

        <!-- Direktan HTML5 Audio plejer (Nema preusmeravanja!) -->
        <div class="player-box">
            <div class="status">🔴 UŽIVO / 24/7 STREAM</div>
            <!-- OVDE UNESI SVOJ DIREKTAN CASTER.FM STREAM LINK UMESTO OVOG PRIMERA -->
            <audio controls preload="none">
                <source src="https://stream.caster.fm:your_port/stream" type="audio/mpeg">
                Tvoj pretraživač ne podržava audio plejer.
            </audio>
        </div>
    </div>

</body>
</html>
