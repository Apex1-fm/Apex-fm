<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Radio | 24/7 Afro & Deep House</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030612;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.7);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0f1d38 0%, var(--bg-deep) 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ogromna svetleća pozadina koja ispunjava ceo ekran da ne bude prazno */
        body::before {
            content: '';
            position: absolute;
            width: 120vw;
            height: 120vh;
            background: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at center, rgba(15, 35, 70, 0.5) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            animation: ambientGlow 6s ease-in-out infinite alternate;
        }

        @keyframes ambientGlow {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Glavni kontejner preko celog ekrana */
        .main-container {
            position: relative;
            z-index: 1;
            background: rgba(10, 16, 34, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid var(--gold);
            border-radius: 32px;
            padding: 35px 40px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.35), inset 0 0 25px rgba(212, 175, 55, 0.15);
            text-align: center;
            max-width: 480px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transition: all 0.4s ease;
        }

        .station-title {
            color: var(--gold);
            margin: 0;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--gold-glow);
        }

        .genres {
            color: #b3c0ed;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: -10px;
            opacity: 0.9;
        }

        /* LEOPARD KOJI SIJA KADA PREĐEŠ MIŠEM */
        .logo-wrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4), inset 0 0 15px rgba(212, 175, 55, 0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        /* Efekat kada strelica ide preko leoparda - sija jako i širi se */
        .logo-wrapper:hover {
            transform: scale(1.03);
            border-color: var(--gold-light);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.85), 0 0 80px rgba(212, 175, 55, 0.4), inset 0 0 30px rgba(212, 175, 55, 0.6);
        }

        .logo-img {
            width: 100%;
            max-height: 310px;
            object-fit: cover;
            display: block;
            transition: filter 0.4s ease;
        }

        .logo-wrapper:hover .logo-img {
            filter: contrast(115%) brightness(105%);
        }

        /* Plejer sekcija */
        .player-box {
            background: rgba(3, 6, 18, 0.7);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            display: flex;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .player-box:hover {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .cstrEmbed {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .cstrEmbed a {
            color: var(--gold);
            font-size: 10px;
            opacity: 0.4;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div>
            <h1 class="station-title">APEX RADIO</h1>
            <div class="genres">Afro House &bull; Deep House &bull; Nu-Disco</div>
        </div>

        <!-- Leopard sa jakim efektom sijanja na hover -->
        <div class="logo-wrapper">
            <img src="logo.jpg" alt="Apex Radio Logo" class="logo-img">
        </div>

        <!-- Caster plejer ispod -->
        <div class="player-box">
            <div data-type="newStreamPlayer" data-publicToken="3f0416fb-134e-4006-9b12-7945caca4eeb" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                <a href="https://www.caster.fm">Stream Hosting</a> 
                <a href="https://www.caster.fm">Radio Server Hosting</a>
            </div>
            <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
        </div>
    </div>

</body>
</html>
